version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: saferoute_mysql
    environment:
      MYSQL_ROOT_PASSWORD: saferoute_root_pw
      MYSQL_DATABASE: saferoute_db
      MYSQL_USER: saferoute_user
      MYSQL_PASSWORD: saferoute_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Native password authentication needed for some older python drivers, 
    # though PyMySQL supports caching_sha2_password. Safe default:
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: saferoute_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

